# ==========================================
# ESP32 LED Matrix Ticker Configuration
# ==========================================

esp32:
  url: "http://ticker.local/set_ticker"  # Change to your ESP32 IP if mDNS fails (e.g., "http://192.168.1.150/set_ticker")
  timeout_seconds: 5

weather:
  latitude: 43.6532
  longitude: -79.3832

sports:
  update_interval_seconds: 45
  teams:
    nhl: "TOR"     # Toronto Maple Leafs
    nfl: "Bills"   # Buffalo Bills keyword for ESPN
