# ==========================================
# ESP32 LED Matrix Ticker Configuration
# ==========================================

# ESP32 Network Settings
esp32:
  url: "http://ticker.local/set_ticker"  # Change to your ESP32's IP address if mDNS fails (e.g., "http://192.168.1.150/set_ticker")
  timeout_seconds: 5

# Weather Settings (Open-Meteo API for Toronto coordinates)
weather:
  enabled: true
  latitude: 43.6532
  longitude: -79.3832
  update_interval_seconds: 900  # 15 minutes

# Sports Teams & Leagues Tracking
sports:
  update_interval_seconds: 45
  teams:
    nhl:
      enabled: true
      team_abbrev: "TOR"
      name: "Toronto Maple Leafs"
      endpoint: "https://api-web.nhle.com/v1/score/now"
      
    nfl:
      enabled: true
      team_keyword: "Bills"
      name: "Buffalo Bills"
      endpoint: "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard"
      
    mlb:
      enabled: false  # Set to true during baseball season
      team_abbrev: "TOR"
      name: "Toronto Blue Jays"
      endpoint: "https://statsapi.mlb.com/api/v1/schedule/games?sportId=1"
      
    nba:
      enabled: true
      team_keyword: "Raptors"
      name: "Toronto Raptors"
      static_fallback: "RAPS NEXT: CHI @ TOR WED 10/21 7:30PM  |  "
