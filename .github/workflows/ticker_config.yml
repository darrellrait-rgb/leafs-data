ticker:
  name: "Toronto LED Ticker"
  refresh_interval_sec: 300
  brightness: 12
  encoding: "utf-8"
  location:
    city: "Toronto"
    latitude: 43.65
    longitude: -79.38
  streams:
    - name: "Weather"
      enabled: true
      source: "open-meteo"
    - name: "Maple Leafs"
      enabled: true
      league: "NHL"
    - name: "Blue Jays"
      enabled: true
      league: "MLB"
    - name: "Bills"
      enabled: true
      league: "NFL"
    - name: "Raptors"
      enabled: true
      league: "NBA"
