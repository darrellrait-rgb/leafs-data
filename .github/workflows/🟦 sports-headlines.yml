name: Toronto Sports Headlines

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install jq
      run: sudo apt-get install -y jq

    # ---------------------------------------------------------
    # FETCH HEADLINES (TOP 5 EACH)
    # ---------------------------------------------------------

    - name: Leafs Headlines (NHL)
      run: |
        echo "Fetching Leafs headlines..."
        curl -s https://api-web.nhle.com/v1/club-news/TOR | tee leafs_news.json

    - name: Raptors Headlines (NBA)
      run: |
        echo "Fetching Raptors headlines..."
        curl -s https://site.api.espn.com/apis/site/v2/sports/basketball/nba/news | tee raptors_news.json

    - name: Jays Headlines (MLB)
      run: |
        echo "Fetching Jays headlines..."
        curl -s https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/news | tee jays_news.json

    - name: TFC Headlines (MLS)
      run: |
        echo "Fetching TFC headlines..."
        curl -s https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/news | tee tfc_news.json

    - name: Argos Headlines (CFL)
      run: |
        echo "Fetching Argos headlines..."
        curl -s https://site.api.espn.com/apis/site/v2/sports/football/cfl/news | tee argos_news.json

    # ---------------------------------------------------------
    # BUILD TOP 5 HEADLINES JSON
    # ---------------------------------------------------------

    - name: Build Headlines JSON
      run: |
        echo "Building sports_headlines.json..."

        jq -n \
        --argjson leafs "$(jq -r '[.items[].headline] | .[:5]' leafs_news.json)" \
        --argjson raptors "$(jq -r '[.articles[].headline] | .[:5]' raptors_news.json)" \
        --argjson jays "$(jq -r '[.articles[].headline] | .[:5]' jays_news.json)" \
        --argjson tfc "$(jq -r '[.articles[].headline] | .[:5]' tfc_news.json)" \
        --argjson argos "$(jq -r '[.articles[].headline] | .[:5]' argos_news.json)" \
        '
        {
          leafs_headlines: $leafs,
          raptors_headlines: $raptors,
          jays_headlines: $jays,
          tfc_headlines: $tfc,
          argos_headlines: $argos
        }
        ' > sports_headlines.json

        echo "sports_headlines.json created:"
        cat sports_headlines.json

    # ---------------------------------------------------------
    # COMMIT
    # ---------------------------------------------------------

    - name: Commit Headlines
      run: |
        echo "Committing headlines..."
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

        git add sports_headlines.json
        git commit -m "Update sports headlines" || echo "No changes"

        echo "Pulling latest changes..."
        git pull --rebase

        echo "Pushing..."
        git push
