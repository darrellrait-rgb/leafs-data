name: Update Toronto JSON

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [update-json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build toronto.json
        run: python3 scripts/build_toronto_json.py

      - name: Commit & push if changed
        run: |
          git config user.name "toronto-json-bot"
          git config user.email "actions@users.noreply.github.com"

          git add toronto.json

          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "auto: update toronto.json"
            git pull --rebase --autostash
            git push
          fi
