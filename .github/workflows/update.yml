name: Update Leafs, Jays, Raptors & Bills Live Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ticker
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build leafs.json
        env:
          BDL_KEY: ${{ secrets.BDL_KEY }}
        run: python3 update_ticker.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add leafs.json debug.json sports_headlines.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update Toronto & Buffalo sports data"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
